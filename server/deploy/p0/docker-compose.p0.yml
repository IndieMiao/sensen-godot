# P0 demo server beside the farm stack on the Hong Kong ECS (SGODOT-232 D1). Prepared only: deploying needs the
# user's approval (see README.md). Image by digest, like the farm app. Joins the farm stack's network so its Caddy
# can reach p0:3110 under /preview/p0/.
services:
  p0:
    image: ${P0_IMAGE:?需要带 digest 的 P0 镜像，如 p0-server@sha256:...}
    restart: unless-stopped
    env_file: [.env.p0]          # P0_ACCESS_KEYS=…, P0_RATE_PER_MINUTE=… (chmod 600, never committed)
    environment:
      P0_DEV: "0"
      P0_TRUST_PROXY: "1"   # behind Caddy: the client address comes from X-Forwarded-For (per-address request cap)
    volumes: [p0data:/data]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [farm]

volumes:
  p0data:

networks:
  farm:
    external: true
    name: farm_default
