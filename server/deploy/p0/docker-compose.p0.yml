# P0 demo server beside the farm stack on the Hong Kong ECS (SGODOT-232 D1), set up like the Journey preview
# (/opt/farm/journey-preview): its own compose project (-p p0), on the farm stack's network farm_default under its own
# alias p0-demo, so farm-caddy-1 reaches p0-demo:3110 under /preview/p0/. No host port. Deploying needs the user's
# approval (see README.md and docs/qa/p0-hk-deploy-plan-2026-10-08.md).
services:
  p0:
    image: ${P0_IMAGE:?需要带 digest 的 P0 镜像，如 p0-server@sha256:...}
    restart: unless-stopped
    env_file: [.env.p0]          # P0_ACCESS_KEYS=…, P0_RATE_PER_MINUTE=… (chmod 600, never committed)
    environment:
      P0_DEV: "0"
      P0_TRUST_PROXY: "1"   # behind Caddy: the client address comes from X-Forwarded-For (per-address request cap)
    volumes: [p0data:/data]
    mem_limit: 256m
    cpus: 0.5             # 2 cores shared with farm, Journey, social demo and voice: P0 never takes more than half of one
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks:
      farm:
        aliases: [p0-demo]   # the name Caddy proxies to; never clashes with another stack's service name

volumes:
  p0data:

networks:
  farm:
    external: true
    name: farm_default
