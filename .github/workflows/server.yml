name: server

on:
  push:
    branches: [main]
    paths:
      # the workspace (pnpm -r runs every package's tests) and its install
      - 'server/**'
      - 'packages/**'
      - 'tools/geo_blueprint/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server.yml'
      # the assets the servers read: as the COPY lists of server/Dockerfile and server/deploy/p0/Dockerfile — a new
      # asset a server reads goes into its Dockerfile and here together
      - 'assets/farm/data/**'
      - 'assets/blueprints/**'
      - 'assets/ponds/catalog.json'
      - 'assets/avatar/parts_manifest.json'
      - 'assets/avatar/demo_denylist.json'
      - 'assets/avatar/npc_only.json'
      - 'assets/p0/p0_content.json'
      - 'assets/p0/content/**'
      - 'assets/p0/p0_outposts.json'
      - 'assets/p0/p0_ponds.json'
      - 'assets/p0/city_clusters.json'
      # and what only the server's tests read (p0_travel: the stamps; landmark_reach: the landmarks)
      - 'assets/p0/stamps/**'
      - 'assets/map/landmarks.json'
      # the online frame both sides keep to (p0_online_rooms compares the server's bytes with it)
      - 'tests/fixtures/p0/frame_v1.hex'
  pull_request:
    paths:
      # the workspace (pnpm -r runs every package's tests) and its install
      - 'server/**'
      - 'packages/**'
      - 'tools/geo_blueprint/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server.yml'
      # the assets the servers read: as the COPY lists of server/Dockerfile and server/deploy/p0/Dockerfile — a new
      # asset a server reads goes into its Dockerfile and here together
      - 'assets/farm/data/**'
      - 'assets/blueprints/**'
      - 'assets/ponds/catalog.json'
      - 'assets/avatar/parts_manifest.json'
      - 'assets/avatar/demo_denylist.json'
      - 'assets/avatar/npc_only.json'
      - 'assets/p0/p0_content.json'
      - 'assets/p0/content/**'
      - 'assets/p0/p0_outposts.json'
      - 'assets/p0/p0_ponds.json'
      - 'assets/p0/city_clusters.json'
      # and what only the server's tests read (p0_travel: the stamps; landmark_reach: the landmarks)
      - 'assets/p0/stamps/**'
      - 'assets/map/landmarks.json'
      # the online frame both sides keep to (p0_online_rooms compares the server's bytes with it)
      - 'tests/fixtures/p0/frame_v1.hex'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # DB 层的单写者语义只有真库能验证；缺库时套件会直接抛错而不是 skip。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: farm
          POSTGRES_DB: sensen_farm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farm" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      CI: '1'
      TEST_DATABASE_URL: postgres://farm:farm@localhost:5432/sensen_farm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hongkong.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: registry.cn-hongkong.aliyuncs.com/sensen/farm-server:${{ github.sha }}
      # 部署只认 digest：tag 可以被重新推送，digest 不能。
      - name: release manifest
        run: |
          cat > release-manifest.json <<JSON
          {
            "git_sha": "${{ github.sha }}",
            "image_digest": "registry.cn-hongkong.aliyuncs.com/sensen/farm-server@${{ steps.build.outputs.digest }}"
          }
          JSON
          cat release-manifest.json
      - uses: actions/upload-artifact@v4
        with: { name: release-manifest, path: release-manifest.json }
