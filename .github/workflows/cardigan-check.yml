name: cardigan-check
run-name: cardigan/${{ inputs.card }}/${{ inputs.delivery }}/${{ inputs.attempt }}/${{ inputs.kind }}/${{ inputs.sha }}/${{ inputs.tree }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of the candidate
        required: true
        type: string
      tree:
        description: Candidate tree
        required: true
        type: string
      card:
        description: Card ID
        required: true
        type: string
      delivery:
        description: Delivery ID
        required: true
        type: string
      attempt:
        description: Check attempt ID
        required: true
        type: string
      kind:
        description: merge_check or precheck
        required: true
        type: string
      # Scoped-check protocol (optional). All four are plain strings, not choices, so an
      # unknown value still dispatches; "Verify candidate" validates them and falls back
      # to the full check for anything missing, unknown or malformed.
      merge_tier:
        description: single, card or batch (default single; batch always runs the full check)
        required: false
        type: string
        default: single
      scope:
        description: full, affected or docs_only (default full)
        required: false
        type: string
        default: full
      affected_paths:
        description: Space-separated package directories for scope=affected
        required: false
        type: string
        default: ''
      skip_checks:
        description: test, e2e or test,e2e for scope=docs_only
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: farm
          POSTGRES_DB: sensen_farm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farm" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      CI: '1'
      TEST_DATABASE_URL: postgres://farm:farm@localhost:5432/sensen_farm_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # Also decides the check scope. Inputs arrive only through env and are compared
      # against fixed patterns; nothing here evaluates them. Only normalized values are
      # written to the step outputs. Any input that is missing, unknown or not a valid
      # combination gives scope=full and runs every step. The logic stays in this
      # trusted workflow file because the checkout is the (untrusted) candidate.
      # Local cases: tools/ci/test-check-inputs.sh.
      - name: Verify candidate
        id: verify
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          CHECK_KIND: ${{ inputs.kind }}
          MERGE_TIER: ${{ inputs.merge_tier }}
          CHECK_SCOPE: ${{ inputs.scope }}
          AFFECTED_PATHS: ${{ inputs.affected_paths }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
          LC_ALL: C # byte-wise [a-z] in the patterns below
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          case "$CHECK_KIND" in merge_check|precheck) ;; *) exit 1 ;; esac
          tier=single scope=full paths='' skips=''
          case "$MERGE_TIER" in single|card|batch) tier=$MERGE_TIER ;; esac
          path='(packages|apps)/[a-z0-9-]+'
          if [[ "$MERGE_TIER" != "$tier" ]]; then
            : # Missing or unknown tier: full.
          elif [[ $tier == batch ]]; then
            : # A batch always runs the full check.
          elif [[ "$CHECK_SCOPE" == affected && -z "$SKIP_CHECKS" && ${#AFFECTED_PATHS} -le 4096 &&
                  "$AFFECTED_PATHS" =~ ^$path(\ $path)*$ ]]; then
            spaces=${AFFECTED_PATHS//[^ ]/}
            if (( ${#spaces} < 64 )); then scope=affected paths=$AFFECTED_PATHS; fi
          elif [[ "$CHECK_SCOPE" == docs_only && -z "$AFFECTED_PATHS" ]]; then
            case "$SKIP_CHECKS" in test|e2e|test,e2e) scope=docs_only skips=$SKIP_CHECKS ;; esac
          fi
          skip_test=false skip_e2e=false
          case ",$skips," in *,test,*) skip_test=true ;; esac
          case ",$skips," in *,e2e,*) skip_e2e=true ;; esac
          # The test step runs the Godot p0 suite, which is not split by workspace
          # package, so scope=affected still runs it in full; e2e is never narrowed.
          {
            echo "merge_tier=$tier"
            echo "scope=$scope"
            echo "affected_paths=$paths"
            echo "skip_test=$skip_test"
            echo "skip_e2e=$skip_e2e"
          } >> "$GITHUB_OUTPUT"
          echo "check scope: tier=$tier scope=$scope skip_test=$skip_test skip_e2e=$skip_e2e affected_paths=${paths:-none}" |
            tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0; packageManager in package.json
      - name: install
        id: install
        run: |
          (
            cd "$RUNNER_TEMP"
            archive=Godot_v4.7.2-stable_linux.x86_64.zip
            curl --fail --location --retry 3 --output "$archive" \
              "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
            echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $archive" | sha256sum --check --strict
            unzip -q "$archive"
            bin="$PWD/${archive%.zip}"
            "$bin" --version
            echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          )
          tools/ci/timed.sh install pnpm install --frozen-lockfile
          # Both toolchains now share a workspace. Don't import installed npm packages as game assets.
          find . -type d -name node_modules -prune -exec sh -ec 'for dir do touch "$dir/.gdignore"; done' sh {} +
      - name: build
        id: build
        run: |
          tools/ci/timed.sh autoload-control tools/ci/test-autoload-gate.sh
          tools/ci/timed.sh import tools/run_tests.sh --ci-import
      - name: test
        if: ${{ steps.verify.outputs.skip_test != 'true' }}
        run: tools/ci/timed.sh p0 tools/run_tests.sh --ci-headless res://tests/p0
      - name: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/ci/timed.sh ui_kit tools/run_tests.sh --ci-headless res://tests/ui_kit
      # Headless --script tests with per-file timeouts and repository r4 fixtures; own step so
      # its result stays separate from p0 / ui_kit. Report: job summary "dynamic_farm tests".
      # The script's 18-minute total budget ends before the 20-minute step limit, so the
      # report (with the files that timed out or did not run) is always written.
      - name: dynamic_farm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        env:
          DYNAMIC_FARM_TOTAL_TIMEOUT: '1080'
        run: |
          tools/ci/timed.sh dynamic_farm-control tools/ci/test-dynamic-farm-gate.sh
          tools/ci/timed.sh dynamic_farm tools/ci/dynamic_farm_tests.sh
      - name: deps
        id: deps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/ci/timed.sh typecheck pnpm -r typecheck
      - name: e2e
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.verify.outputs.skip_e2e != 'true' }}
        run: tools/ci/timed.sh server-tests pnpm -r test
