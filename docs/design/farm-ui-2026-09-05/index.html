<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>街角四季 · UI 设计稿</title>
  <style>
    :root{color-scheme:light;--paper:#fcfefa;--ink:#243d35;--muted:#64786e;--green:#287c59;--line:#d2e2d6;--blue:#43869f}
    *{box-sizing:border-box;letter-spacing:0}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    header,main,footer{max-width:1440px;margin:auto;padding:24px 32px}
    header{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
    h1{font-size:26px;line-height:1.4;margin:0 0 8px}h2{font-size:18px;line-height:1.5;margin:0}
    p{margin:0 0 8px}.meta{font-size:13px;color:var(--muted)}
    a{color:var(--green);text-underline-offset:3px}nav{display:flex;gap:20px;flex-wrap:wrap;flex-shrink:0}
    .notice{color:var(--blue);margin-bottom:28px;max-width:920px}
    .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px}
    figure{margin:0;min-width:0}.preview{display:block;line-height:0;outline-offset:4px}.preview img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;border:1px solid var(--line)}
    figcaption{padding-top:12px}.caption-head{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:6px}
    .links{display:flex;gap:16px;align-items:center;white-space:nowrap;font-size:13px}
    .close img{width:18px;height:18px}.close:hover{background:#e8f4ed}
    footer{border-top:1px solid var(--line);margin-top:20px;font-size:13px;color:var(--muted)}
    dialog{border:1px solid var(--line);border-radius:8px;padding:48px 12px 12px;background:var(--paper);width:min(96vw,1800px);max-width:96vw;max-height:96dvh;overflow:auto}
    dialog::backdrop{background:rgb(15 30 25 / 78%)}
    dialog>img{display:block;width:100%;height:auto}.close{position:absolute;top:6px;right:8px;width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--paper);display:grid;place-items:center;cursor:pointer}
    @media(max-width:720px){header,main,footer{padding:20px 16px}header{display:block}nav{margin-top:16px}.gallery{grid-template-columns:1fr;gap:30px}h1{font-size:23px}.caption-head{align-items:flex-start}h2{font-size:17px}.links{gap:10px}}
  </style>
</head>
<body>
  <header>
    <div><h1>街角四季 · UI 设计稿</h1><p class="meta">2026-09-05 · sensenjoy · gpt-image-2 · 4 张设计板</p></div>
    <nav aria-label="相关文档"><a href="../../qa/farm-controls-guide.html">操作指南</a><a href="README.md">验证记录</a><a href="image-prompts.md">生成记录</a></nav>
  </header>
  <main>
    <p class="notice">以下为使用游戏运行截图作参考生成的 AI 设计概念稿。图中的植物、场景细节和部分排版是设计表达，当前安装包的实际效果以操作指南中的截图为准。</p>
    <div class="gallery">
      <figure>
        <a class="preview" href="generated/map-design.png" data-title="地图与农场选择"><img src="generated/map-design.png" width="2048" height="1536" alt="地图与农场选择设计板，包含自家定位、访问预览、角色标记、缩放和回弹状态"></a>
        <figcaption><div class="caption-head"><h2>01 · 地图与农场选择</h2><div class="links"><a href="prompts/01-map.txt">提示词</a><a href="generated/map-design.png" target="_blank" rel="noopener">原图</a></div></div><p class="meta">角色与蓝图标记、选中后聚焦、15–18 级缩放及边界回弹。</p></figcaption>
      </figure>
      <figure>
        <a class="preview" href="generated/farm-design.png" data-title="种田与动作反馈"><img src="generated/farm-design.png" width="2048" height="1536" alt="种田主界面设计板，包含播种、劳作、地块小图标、点击移动和阻挡反馈"></a>
        <figcaption><div class="caption-head"><h2>02 · 种田与动作反馈</h2><div class="links"><a href="prompts/02-farm.txt">提示词</a><a href="generated/farm-design.png" target="_blank" rel="noopener">原图</a></div></div><p class="meta">顶部状态、底部单一主动作、九块田的轻量提示和移动反馈。</p></figcaption>
      </figure>
      <figure>
        <a class="preview" href="generated/panels-design.png" data-title="摊位、目标与访客"><img src="generated/panels-design.png" width="2048" height="1536" loading="lazy" alt="摊位、今日目标和访客模式三屏设计，展示一致的弹层及关闭规则"></a>
        <figcaption><div class="caption-head"><h2>03 · 摊位、目标与访客</h2><div class="links"><a href="prompts/03-panels.txt">提示词</a><a href="generated/panels-design.png" target="_blank" rel="noopener">原图</a></div></div><p class="meta">互斥弹层、交易信息层级、目标清单与只读拜访。</p></figcaption>
      </figure>
      <figure>
        <a class="preview" href="generated/secondary-design.png" data-title="城市、换装与调试面板"><img src="generated/secondary-design.png" width="2048" height="1536" loading="lazy" alt="城市选择、角色换装和仅供 QA 使用的导演面板设计"></a>
        <figcaption><div class="caption-head"><h2>04 · 城市、换装与调试面板</h2><div class="links"><a href="prompts/04-secondary.txt">提示词</a><a href="generated/secondary-design.png" target="_blank" rel="noopener">原图</a></div></div><p class="meta">简洁城市选择、完整角色展示、服装缩略图和独立 QA 控件。</p></figcaption>
      </figure>
    </div>
  </main>
  <footer>生成接口与原始提示词记录在项目内；凭据未写入文件。真机最终版本的安装验证仍待设备重新连接。</footer>
  <dialog aria-label="设计原图"><button class="close" type="button" title="关闭原图" aria-label="关闭原图"><img src="../../../assets/ui/icons/lucide/x.svg" alt=""></button><img alt=""></dialog>
  <script>
    const dialog = document.querySelector('dialog');
    const fullImage = dialog.querySelector(':scope > img');
    for (const link of document.querySelectorAll('.preview')) {
      link.addEventListener('click', event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        fullImage.src = link.href;
        fullImage.alt = link.dataset.title;
        dialog.setAttribute('aria-label', link.dataset.title);
        dialog.showModal();
      });
    }
    dialog.querySelector('.close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const bounds = dialog.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
    });
  </script>
</body>
</html>
