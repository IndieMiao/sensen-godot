<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI anchors · contact sheet (v3 control layer)</title>
<style>
  :root { --bg:#F6F1E6; --ink:#2B2A28; --ink-2:#6B675F; --edge:rgba(0,0,0,.08); }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family: "Nunito", "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  .sheet { width:1880px; padding:40px; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:40px 40px; align-items:flex-start; }
  figure { margin:0; width:420px; }
  figure img { display:block; width:420px; height:933px; border-radius:30px; box-shadow:0 2px 0 var(--edge), 0 14px 32px rgba(0,0,0,.10); }
  figcaption { margin-top:18px; display:flex; align-items:baseline; gap:12px; white-space:nowrap; }
  figcaption .id { font-size:26px; font-weight:800; letter-spacing:.5px; }
  figcaption .name { font-size:22px; font-weight:700; color:var(--ink-2); }
  figcaption .sep { color:var(--ink-2); font-weight:700; }
</style>
</head>
<body>
<div class="sheet">
  <figure><img src="../out/v3/FARM-1.png" alt=""><figcaption><span class="id">FARM-1</span><span class="sep">·</span><span class="name">Farm · joystick + Sow</span></figcaption></figure>
  <figure><img src="../out/v3/FISH-1.png" alt=""><figcaption><span class="id">FISH-1</span><span class="sep">·</span><span class="name">Pond · Cast</span></figcaption></figure>
  <figure><img src="../out/v3/COOK-1.png" alt=""><figcaption><span class="id">COOK-1</span><span class="sep">·</span><span class="name">Kitchen · Cook</span></figcaption></figure>
  <figure><img src="../out/v3/ACTION-RADIAL.png" alt=""><figcaption><span class="id">ACTION-RADIAL</span><span class="sep">·</span><span class="name">Mode radial open</span></figcaption></figure>
  <figure><img src="../out/v3/COOK-2a-recipes.png" alt=""><figcaption><span class="id">COOK-2a</span><span class="sep">·</span><span class="name">Recipes drawer</span></figcaption></figure>
  <figure><img src="../out/v3/COOK-2b-experiment.png" alt=""><figcaption><span class="id">COOK-2b</span><span class="sep">·</span><span class="name">Experiment drawer</span></figcaption></figure>
  <figure><img src="../out/v3/BAG-1.png" alt=""><figcaption><span class="id">BAG-1</span><span class="sep">·</span><span class="name">Bag drawer</span></figcaption></figure>
</div>
</body>
</html>
