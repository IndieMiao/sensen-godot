<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>NPC-5 · Resident Dialogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../kit-npc.css">
</head>
<!-- NPC-5 (group npc): talking to Pip in the plaza. Bottom dialogue bar (portrait · name + role · Acquainted tag with a tiny progress bar ·
     one line · Gift / Request). Pip's head bubble is gone while talking; the main action button and quick bar step aside. Dialogue costs 0 Energy. -->
<body class="scene-cam" style="--scene-top:#BEDDD2; --scene-bottom:#F7DCB5; --src-w:1024px; --src-h:1536px; --cam-scale:1.12; --cam-x:-30px; --cam-y:360px;">
<div class="canvas">

  <div class="scene-layer">
    <img class="scene" src="../../scenes/travel-post.png" alt="">
  </div>
  <div class="bar-veil"></div>

  <!-- scene tags as on NPC-1 (Pip's ! bubble removed: the chat is open) -->
  <div class="tag tag-sign tag--anchor-bottom" style="--x:597px; --y:676px">Shanghai Travel Post</div>
  <!-- Pip's name floats over his head while the chat is open -->
  <div class="tag tag-name tag--pointer tag--anchor-bottom" style="--x:373px; --y:1066px"><svg class="ic" aria-hidden="true"><use href="../icons-npc.svg#i-face-pip"/></svg><span>Pip</span></div>

  <!-- dialogue bar (replaces the quick-bar zone while open) -->
  <section class="dlg">
    <div class="portrait"><svg class="ic" aria-hidden="true"><use href="../icons-npc.svg#i-face-pip"/></svg></div>
    <div class="mid">
      <div class="who"><span class="nm">Pip</span><span class="role">· Courier Kid</span></div>
      <div class="stage"><span class="tag-stage">Acquainted</span><div class="track" style="--pct:42%"><i></i></div><span class="next">next · Familiar</span></div>
      <div class="say">“Got a Common fish for me? Any kind.”</div>
      <div class="acts"><div class="btn-sm btn-primary"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-gift"/></svg>Gift</div><div class="btn-sm btn-sec">Request</div></div>
    </div>
  </section>

  <header class="hud">
    <div class="hud-row1">
      <div class="avatar-btn" title="Profile · Passport">
        <svg class="skill-ring" viewBox="0 0 112 112" aria-hidden="true">
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(47,58,51,.08)" stroke-width="8"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(127,198,106,.28)" stroke-width="8" stroke-dasharray="163.4 326.7" transform="rotate(-90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="#7FC66A" stroke-width="8" stroke-linecap="round" stroke-dasharray="73 326.7" transform="rotate(-90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(111,168,220,.28)" stroke-width="8" stroke-dasharray="163.4 326.7" transform="rotate(90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="#6FA8DC" stroke-width="8" stroke-linecap="round" stroke-dasharray="98 326.7" transform="rotate(90 56 56)"/>
        </svg>
        <div class="avatar-face"></div>
      </div>
      <div class="energy-card card" style="--pct:71%">
        <div class="energy-top"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-energy"/></svg><div class="energy-num">142<span class="of">/200</span></div></div>
        <div class="energy-track"><div class="energy-fill"></div></div>
        <div class="energy-regen">+1 in <b>2:41</b></div>
      </div>
      <div class="grow"></div>
      <div class="coins card"><span>230</span><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-coin"/></svg></div>
      <div class="inbox-btn card" title="Inbox"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-bell"/></svg><span class="badge">3</span></div>
    </div>
    <div class="hud-row2">
      <div class="today card"><b>Today</b><span class="dot-sep">·</span><span class="today-text">Deliver 4 Fine fish · Shanghai Market</span><svg class="chev" aria-hidden="true"><use href="../icons.svg#i-chevron"/></svg></div>
      <div class="place card" title="Map · Cities"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-home"/></svg><span>Shanghai</span><span class="sep">·</span><span class="space">Travel Post</span><svg class="chev-r" aria-hidden="true"><use href="../icons.svg#i-chev-r"/></svg></div>
    </div>
  </header>

</div>
</body>
</html>
