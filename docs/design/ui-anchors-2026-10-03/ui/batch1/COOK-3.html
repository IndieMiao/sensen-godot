<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>COOK-3 · Heat Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../kit-cook.css">
</head>
<!-- body class "scene-cam" = camera mode (v2): canvas = source × --cam-scale + (--cam-x, --cam-y).
     Batch 1 (2026-10-03, cook group): shared kit.css/icons.svg untouched; additions live in kit-cook.css / icons-cook.svg. -->
<body class="scene-cam" style="--scene-top:#B2D6D0; --scene-bottom:#F4D9B7; --src-w:1024px; --src-h:1536px; --cam-scale:1.39; --cam-x:-229px; --cam-y:280px;">
<div class="canvas">

  <!-- Scene layer: AI diorama only, no UI/text in the png -->
  <div class="scene-layer">
    <img class="scene" src="../../scenes/kitchen.png" alt="">
  </div>
  <div class="bar-veil"></div>
  <!-- positions assume body.scene-cam with --cam-scale:1.39, --cam-x:-229px, --cam-y:280px; the steaming pot sits on stove 2 at ≈ (548, 1070) -->
  <div class="tag tag-stove tag--pointer tag--anchor-top" style="--x:367px; --y:1274px; --dx:-48px"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-stove-off"/></svg><span>Stove 1/3</span><span class="sep">·</span><span class="st-empty">Empty</span></div>
  <div class="tag tag-card tag--pointer tag--anchor-top" style="--x:981px; --y:1326px; --dx:-128px"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-cabinet"/></svg><span>Warming Cabinet</span><span class="sub">4/6</span></div>
  <!-- heat ring floats above the pot: needle sweeps clockwise (1.2–1.6 s), gold arc = hit zone; tap anywhere on the pot -->
  <div class="heat" style="--x:560px; --y:770px; --d:360px"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-track" cx="100" cy="100" r="80"/><line class="tick" x1="100" y1="12" x2="100" y2="26"/><path class="ring-gold" d="M116.6 21.8A80 80 0 0 1 170.6 62.4"/><line class="needle" x1="100" y1="100" x2="123.9" y2="34.2"/><circle class="hub" cx="100" cy="100" r="10"/></svg></div>
  <div class="tag tag-tip" style="--x:560px; --y:1000px"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-info"/></svg><span>Tap when the needle hits gold!</span></div>
  <div class="float is-gold" style="--x:800px; --y:620px; --fs:52px; --rot:-8deg">Nice heat! ★</div>
  <div class="tap" style="--x:560px; --y:1090px"></div>
  <div class="prog is-timer" style="--x:560px; --y:1280px; --d:170px; --dash:302; --fs:40px"><svg viewBox="0 0 300 300"><circle class="track" cx="150" cy="150" r="120"/><circle class="fill" cx="150" cy="150" r="120"/></svg><div class="pct">0:09</div></div>
  <div class="switch" title="Switch action"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-switch"/></svg></div>
  <div class="fab" title="Cook"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-pot"/></svg><span class="lbl">Cook</span><span class="sub is-free">Free</span></div>
  <!-- kitchen has no quick bar: only the FAB (Cook) and a lone Bag at the bar's right end -->
  <div class="bag-fixed"><div class="bag card"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-bag"/></svg><span class="chip-label">Bag</span><span class="cap-dot"></span></div></div>
  <!-- HUD v2: row1 y48–176 = avatar 112 · energy card 112 (bar 240×12) · coins 72 · Inbox 96
       row2 y192–256 = Today chip (left, shrinks) · place chip (right): house = home city · "City · Space" · › opens the Map -->
  <header class="hud">
    <div class="hud-row1">
      <div class="avatar-btn" title="Profile · Passport">
        <svg class="skill-ring" viewBox="0 0 112 112" aria-hidden="true">
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(47,58,51,.08)" stroke-width="8"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(127,198,106,.28)" stroke-width="8" stroke-dasharray="163.4 326.7" transform="rotate(-90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="#7FC66A" stroke-width="8" stroke-linecap="round" stroke-dasharray="73 326.7" transform="rotate(-90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(111,168,220,.28)" stroke-width="8" stroke-dasharray="163.4 326.7" transform="rotate(90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="#6FA8DC" stroke-width="8" stroke-linecap="round" stroke-dasharray="98 326.7" transform="rotate(90 56 56)"/>
        </svg>
        <div class="avatar-face"></div>
      </div>
      <div class="energy-card card" style="--pct:71%">
        <div class="energy-top"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-energy"/></svg><div class="energy-num">142<span class="of">/200</span></div></div>
        <div class="energy-track"><div class="energy-fill"></div></div>
        <div class="energy-regen">+1 in <b>2:41</b></div>
      </div>
      <div class="grow"></div>
      <div class="coins card"><span>230</span><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-coin"/></svg></div>
      <div class="inbox-btn card" title="Inbox"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-bell"/></svg><span class="badge">3</span></div>
    </div>
    <div class="hud-row2">
      <div class="today card"><b>Today</b><span class="dot-sep">·</span><span class="today-text">Deliver 4 Fine fish</span><svg class="chev" aria-hidden="true"><use href="../icons.svg#i-chevron"/></svg></div>
      <div class="place card" title="Map · Cities"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-home"/></svg><span>Shanghai</span><span class="sep">·</span><span class="space">Kitchen</span><svg class="chev-r" aria-hidden="true"><use href="../icons.svg#i-chev-r"/></svg></div>
    </div>
  </header>
  <!-- Guide overlay: ?guide=1 or #guide -->
  <div id="guide" class="guide">
    <div class="g-line" style="top:120px"><span>safe top 120</span></div>
    <div class="g-line" style="top:2300px"><span>safe bottom 100</span></div>
    <div class="g-line is-green" style="top:2276px"><span>quick bar bottom · 124 from bottom</span></div>
    <div class="g-line is-green" style="top:2116px"><span>slots top · 160 tall</span></div>
    <div class="g-line is-blue" style="top:48px"><span>HUD row 1 · 48–176</span></div>
    <div class="g-line is-blue" style="top:176px"></div>
    <div class="g-line is-blue" style="top:192px"><span>HUD row 2 · 192–256</span></div>
    <div class="g-line is-blue" style="top:256px"></div>
    <div class="g-vline" style="left:30px"></div>
    <div class="g-vline" style="left:1050px"></div>
    <div class="g-vline" style="left:540px;border-left-style:dotted"></div>
    <div class="g-box" style="right:30px;top:1876px;width:176px;height:176px;border-radius:88px">FAB 176</div>
    <div class="g-box" style="right:70px;top:1756px;width:96px;height:96px;border-radius:48px"></div>
  </div>
  <script>if(/[?&]guide=1(?:&|$)/.test(location.search))document.documentElement.classList.add('show-guide')</script>

</div>
</body>
</html>
