<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>NPC-1 · Outpost Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../kit-npc.css">
<link rel="stylesheet" href="../kit-facility.css">
</head>
<!-- NPC-1 (group npc, 2026-10-03): outpost group plaza — Market (tea window at its right end) · Tackle Shop · Travel Post, tea table + parasol, Market Board.
     Base = ../../scenes/outpost.png (1024×1536, temperate coastal skin, blank signs). Camera: canvas = source × 1.22 + (−73, 360).
     Bottom: quick bar collapsed to a handle + Bag only. Facility-tap revision (2026-10-04): no main action key in an outpost
     (the key never shows a facility verb) — shopping starts by tapping the Market counter, which carries a fingertip card
     "Market · Tap to shop" (2 px primary stroke, ../kit-facility.css) on the stall awning; Mei's name tag moved under her
     (pointer on her apron) and the Market Board label under the board so the awning band stays clear. -->
<body class="scene-cam" style="--scene-top:#ADD5D0; --scene-bottom:#F7D9BB; --src-w:1024px; --src-h:1536px; --cam-scale:1.22; --cam-x:-73px; --cam-y:360px;">
<div class="canvas">

  <div class="scene-layer">
    <img class="scene" src="../../scenes/outpost.png" alt="">
  </div>
  <div class="bar-veil"></div>

  <!-- under-HUD line: this is your home outpost (remote browsing would say "Travel to use · Trip 3 · 20 Energy · 60 coins") -->
  <div class="under-hud is-center"><div class="notice-chip"><span class="ok">Free</span><span class="sub">·</span><span>Home Outpost</span></div></div>

  <!-- scene tags (canvas = source × 1.22 + (−73, 360)) -->
  <!-- plaza sign (group name, art text) mounted on the market roof ridge -->
  <div class="tag tag-sign tag--anchor-bottom" style="--x:236px; --y:852px">Pudong Market</div>
  <!-- Market counter = the tappable facility: fingertip card on the stall awning's front edge (canvas ≈ 175, 1010), card slid right -->
  <div class="tag tag-tap tag--pointer tag--anchor-bottom" style="--x:175px; --y:1010px; --dx:105px"><svg class="ic" aria-hidden="true"><use href="../icons-npc.svg#i-shop"/></svg><span>Market</span><span class="sep">·</span><span class="hint">Tap to shop</span></div>
  <!-- Market Keeper name tag, now under her: pointer on her apron (canvas ≈ 250, 1082), card over the counter front -->
  <div class="tag tag-name tag--pointer tag--anchor-top" style="--x:250px; --y:1082px; --dx:-10px"><svg class="ic" aria-hidden="true"><use href="../icons-npc.svg#i-face-mei"/></svg><span>Market Keeper</span><span class="role">· Mei</span></div>
  <!-- Tea Counter: small sign on the tea window awning at the counter's right end (src 402, 470), slid 40 right off the tap card -->
  <div class="tag tag-sign is-small tag--anchor-bottom" style="--x:417px; --y:938px; --dx:40px">Tea Counter</div>
  <!-- Market Board label, now under the board: pointer on the bottom rail (canvas ≈ 330, 1386), card slid right clear of Pip -->
  <div class="tag tag-card tag--pointer tag--anchor-top" style="--x:330px; --y:1386px; --dx:70px"><svg class="ic" aria-hidden="true"><use href="../icons-npc.svg#i-board"/></svg><span>Market Board</span></div>
  <!-- Pip (courier kid by the board): yellow ! = new request / new chat -->
  <div class="bubble is-new" style="--x:208px; --y:1286px">!</div>

  <!-- bottom: collapsed quick-bar handle · Bag only (no main action key, no switch in an outpost) -->
  <div class="bar-handle" title="Quick bar"><div class="grip"></div></div>
  <div class="bag card bag-fixed"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-bag"/></svg><span class="chip-label">Bag</span><span class="cap-dot"></span></div>

  <header class="hud">
    <div class="hud-row1">
      <div class="avatar-btn" title="Profile · Passport">
        <svg class="skill-ring" viewBox="0 0 112 112" aria-hidden="true">
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(47,58,51,.08)" stroke-width="8"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(127,198,106,.28)" stroke-width="8" stroke-dasharray="163.4 326.7" transform="rotate(-90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="#7FC66A" stroke-width="8" stroke-linecap="round" stroke-dasharray="73 326.7" transform="rotate(-90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="rgba(111,168,220,.28)" stroke-width="8" stroke-dasharray="163.4 326.7" transform="rotate(90 56 56)"/>
          <circle cx="56" cy="56" r="52" fill="none" stroke="#6FA8DC" stroke-width="8" stroke-linecap="round" stroke-dasharray="98 326.7" transform="rotate(90 56 56)"/>
        </svg>
        <div class="avatar-face"></div>
      </div>
      <div class="energy-card card" style="--pct:71%">
        <div class="energy-top"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-energy"/></svg><div class="energy-num">142<span class="of">/200</span></div></div>
        <div class="energy-track"><div class="energy-fill"></div></div>
        <div class="energy-regen">+1 in <b>2:41</b></div>
      </div>
      <div class="grow"></div>
      <div class="coins card"><span>230</span><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-coin"/></svg></div>
      <div class="inbox-btn card" title="Inbox"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-bell"/></svg><span class="badge">3</span></div>
    </div>
    <div class="hud-row2">
      <div class="today card"><b>Today</b><span class="dot-sep">·</span><span class="today-text">Deliver 4 Fine fish · Shanghai Market</span><svg class="chev" aria-hidden="true"><use href="../icons.svg#i-chevron"/></svg></div>
      <div class="place card" title="Map · Cities"><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-home"/></svg><span>Shanghai</span><span class="sep">·</span><span class="space">Pudong Market</span><svg class="chev-r" aria-hidden="true"><use href="../icons.svg#i-chev-r"/></svg></div>
    </div>
  </header>

  <div id="guide" class="guide">
    <div class="g-line" style="top:120px"><span>safe top 120</span></div>
    <div class="g-line" style="top:2300px"><span>safe bottom 100</span></div>
    <div class="g-line is-green" style="top:2276px"><span>bar bottom · 124 from bottom</span></div>
    <div class="g-line is-blue" style="top:48px"><span>HUD row 1 · 48–176</span></div>
    <div class="g-line is-blue" style="top:192px"><span>HUD row 2 · 192–256</span></div>
    <div class="g-vline" style="left:30px"></div>
    <div class="g-vline" style="left:1050px"></div>
  </div>
  <script>if(/[?&]guide=1(?:&|$)/.test(location.search))document.documentElement.classList.add('show-guide')</script>

</div>
</body>
</html>
