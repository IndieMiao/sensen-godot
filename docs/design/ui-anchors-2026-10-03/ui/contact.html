<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI anchors · contact sheet</title>
<style>
  :root { --bg:#F6F1E6; --ink:#2B2A28; --ink-2:#6B675F; --edge:rgba(0,0,0,.08); }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family: "Nunito", "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  .sheet { width:1780px; padding:40px; box-sizing:border-box; display:flex; gap:40px; align-items:flex-start; }
  figure { margin:0; width:540px; }
  figure img { display:block; width:540px; height:1200px; border-radius:36px; box-shadow:0 2px 0 var(--edge), 0 18px 40px rgba(0,0,0,.10); }
  figcaption { margin-top:22px; display:flex; align-items:baseline; gap:14px; white-space:nowrap; }
  figcaption .id { font-size:30px; font-weight:800; letter-spacing:.5px; }
  figcaption .name { font-size:26px; font-weight:700; color:var(--ink-2); }
  figcaption .sep { color:var(--ink-2); font-weight:700; }
</style>
</head>
<body>
<div class="sheet">
  <figure><img src="../out/FARM-1.png" alt=""><figcaption><span class="id">FARM-1</span><span class="sep">·</span><span class="name">Farm Overview</span></figcaption></figure>
  <figure><img src="../out/FISH-1.png" alt=""><figcaption><span class="id">FISH-1</span><span class="sep">·</span><span class="name">Pond Scene</span></figcaption></figure>
  <figure><img src="../out/COOK-1.png" alt=""><figcaption><span class="id">COOK-1</span><span class="sep">·</span><span class="name">Kitchen &amp; Stove Select</span></figcaption></figure>
</div>
</body>
</html>
