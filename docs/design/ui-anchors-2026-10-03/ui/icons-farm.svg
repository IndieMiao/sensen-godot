<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Batch 1 icon additions by the farm group (2026-10-03). Referenced from ui/batch1 pages via <use href="../icons-farm.svg#i-…">.
