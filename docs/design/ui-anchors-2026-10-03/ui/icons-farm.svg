      <path fill="#FBF8F1" d="M12 24h40v14a16 16 0 0 1-16 16h-8a16 16 0 0 1-16-16z"/>
      <path fill="#B98A5E" d="M12 24h40v6H12z"/>
      <path fill="#FBF8F1" d="M52 30h4a6 6 0 0 1 0 12h-4v-6h4v-0h-4z"/>
