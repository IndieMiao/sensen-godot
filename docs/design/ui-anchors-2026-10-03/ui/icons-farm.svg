      <rect x="12" y="14" width="40" height="26" rx="4" fill="#F6ECD6"/>
      <rect x="29" y="44" width="6" height="14" rx="3" fill="#9A6F47"/>
      <rect x="18" y="20" width="18" height="4" rx="2" fill="#B98A5E"/><rect x="18" y="28" width="26" height="4" rx="2" fill="#B98A5E"/>
